[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-video-encoding"
version = "2.0.0"
description = "django-video-encoding helps to convert your videos into different formats and resolutions."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Alexander Frenzel", email = "alex@relatedworks.com" },
]
keywords = ["django", "video", "encoding", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2",
    "django-appconf>=1.2",
    "pillow>=12.0",
]

[project.urls]
Documentation = "https://github.com/escaped/django-video-encoding/blob/master/README.md"
Homepage = "https://github.com/escaped/django-video-encoding"
Repository = "https://github.com/escaped/django-video-encoding"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-django>=4.14",
    "pytest-mock>=3.15",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["video_encoding"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "T10", # flake8-debugger
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # code is formatted using ruff format
]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_proj.settings"
pythonpath = ["."]
addopts = "--durations=10 --cov=video_encoding --cov-report=term --cov-report=xml"
norecursedirs = "build dist .venv"
testpaths = [
    "video_encoding",
    "test_proj",
]

[tool.coverage.run]
relative_files = true
branch = true
source = ["video_encoding"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __unicode__",
    "def __repr__",
    "def __str__",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == __main__:",
    # No need to check type checking imports
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
platform = "linux"
ignore_missing_imports = true
