name: Test & Lint

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy video_encoding test_proj
      - name: Build package
        run: uv build

  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 and 6.1 require Python >= 3.12
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          uv pip install --reinstall "Django~=${{ matrix.django-version }}.0"
      - name: Smoke test the test project
        run: |
          uv run --no-sync python -m django check --settings=test_proj.settings
          uv run --no-sync python -m django makemigrations --check --dry-run --settings=test_proj.settings
          uv run --no-sync python -m django migrate --noinput --settings=test_proj.settings
          uv run --no-sync python -m django runserver 127.0.0.1:8000 --noreload --settings=test_proj.settings &
          SERVER_PID=$!
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null
          kill "$SERVER_PID"
      - name: Test
        run: uv run --no-sync pytest
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
